# Default values for flaggy.

replicaCount: 1

image:
  repository: ghcr.io/getflaggy/flaggy
  # Defaults to the chart appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

config:
  # Listen address passed as FLAGGY_PORT.
  port: ":8080"
  # SQLite path (must live on the persistent volume, see persistence).
  dbPath: /data/flaggy.db
  # FLAGGY_CORS: "true" to enable, "false" behind a reverse proxy (Oathkeeper...).
  cors: "true"

auth:
  # Master key for admin routes. If none is provided, auth is DISABLED (dev only).
  # Provide exactly one of the two below for production:
  masterKey: ""            # inline value -> the chart creates a Secret (avoid in git)
  existingSecret: ""       # name of an existing Secret holding the master key
  existingSecretKey: master-key

# SQLite lives on a PVC. Disabling persistence uses an emptyDir (data lost on restart).
persistence:
  enabled: true
  storageClass: ""
  accessModes: [ReadWriteOnce]
  size: 1Gi

resources: {}

podSecurityContext:
  fsGroup: 65532
securityContext: {}

livenessProbe:
  tcpSocket: { port: http }
  initialDelaySeconds: 10
  periodSeconds: 15
readinessProbe:
  tcpSocket: { port: http }
  initialDelaySeconds: 5
  periodSeconds: 10

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
    # - host: flaggy.example.com
    #   paths: [{ path: /, pathType: Prefix }]
  tls: []

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
